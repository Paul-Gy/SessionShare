name = "sessionshare"
compatibility_date = "2026-05-06"
main = "./src/index.ts"

[vars]
# Custom domain for public R2 bucket access
# R2_CUSTOM_DOMAIN = "files.sessionshare.net"

[[rules]]
type = "ESModule"
globs = ["**/*.ts"]

[durable_objects]
bindings = [{ name = "SESSIONS", class_name = "SharingSession" }]

[[migrations]]
tag = "v1"
new_classes = ["SharingSession"]

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "sessionshare"
preview_bucket_name = "sessionshare"

[assets]
directory = "./frontend/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]
