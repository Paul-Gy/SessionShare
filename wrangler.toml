name = "sessionshare"
compatibility_date = "2026-09-25"
main = "./server/index.ts"

[vars]
# Custom domain for public R2 bucket access
# R2_CUSTOM_DOMAIN = "files.sessionshare.net"

[durable_objects]
bindings = [{ name = "SESSIONS", class_name = "SharingSession" }]

[[migrations]]
tag = "v1"
new_classes = ["SharingSession"]

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "sessionshare"
preview_bucket_name = "sessionshare"

[[ratelimits]]
name = "CREATE_LIMITER"
namespace_id = "1001"

[ratelimits.simple]
limit = 5
period = 60

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]
